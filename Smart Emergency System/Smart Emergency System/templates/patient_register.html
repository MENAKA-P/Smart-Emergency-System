{% extends "base.html" %}


{% block content %}


<div class="form-page">


    <div class="form-card">


        <div class="form-header">


            <div class="medical-logo">
                ✚
            </div>


            <h2>
                Create Patient Account
            </h2>


            <p>
                Enter your personal information
                to create your SmartCare account.
            </p>


        </div>


        <form method="POST">


            <div class="form-grid">


                <div class="input-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        name="name"
                        type="text"
                        placeholder="Enter full name"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>
                        Age
                    </label>

                    <input
                        name="age"
                        type="number"
                        min="1"
                        max="120"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>
                        Gender
                    </label>

                    <select name="gender">

                        <option>
                            Female
                        </option>

                        <option>
                            Male
                        </option>

                        <option>
                            Other
                        </option>

                    </select>

                </div>


                <div class="input-group">

                    <label>
                        Blood Group
                    </label>

                    <select name="blood_group">

                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                        <option>O+</option>
                        <option>O-</option>

                    </select>

                </div>


                <div class="input-group">

                    <label>
                        Phone
                    </label>

                    <input
                        name="phone"
                        type="tel"
                        placeholder="9876543210"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>
                        Email
                    </label>

                    <input
                        name="email"
                        type="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


            </div>


            <div class="input-group">

                <label>
                    Address
                </label>

                <textarea
                    name="address"
                    placeholder="Enter your address"
                ></textarea>

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    name="password"
                    type="password"
                    placeholder="Create password"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-button full-width"
            >

                Create Account

            </button>


        </form>


        <p class="form-footer">

            Already registered?

            <a href="{{ url_for('patient_login') }}">
                Login
            </a>

        </p>


    </div>


</div>


{% endblock %}
